<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>microdocs</title>
    <link rel="icon" type="image/svg+xml" href="/src/logo.svg" />
    <!-- Установка на экран Домой: на iPhone и iPad открывается как приложение, без панелей Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="microdocs" />
    <script>
      // Тема до загрузки приложения, иначе в тёмной теме мелькает белый экран.
      // Ключ и значения — как у localStorageColorSchemeManager в Mantine.
      try {
        var scheme = localStorage.getItem('mantine-color-scheme-value');
        if (scheme !== 'light' && scheme !== 'dark') {
          scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
