<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>microdocs</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #222; }
      @media (prefers-color-scheme: dark) { body { background: #242424; color: #c9c9c9; } }
      main { max-width: 440px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 12px; }
      code { font-size: 12px; opacity: 0.6; }
      button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 0; background: #4c6ef5; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Не удалось открыть microdocs</h1>
      <p id="text"></p>
      <p><code id="code"></code></p>
      <button id="retry" type="button">Повторить</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const texts = {
        offline: [
          'Нет связи с сервером',
          'Первый запуск нужен с интернетом: после него приложение открывается и без сети.',
        ],
        cert: [
          'Нет клиентского сертификата',
          'Сервер пускает только по сертификату. Откройте client.p12 двойным щелчком, ' +
            'добавьте в связку «Вход» и перезапустите приложение.',
        ],
        keychain: [
          'Нет доступа к ключу',
          'macOS не дала подписать сертификатом. Нажмите «Повторить» и в окне Связки ключей ' +
            'выберите «Разрешать всегда».',
        ],
      };
      const [title, text] = texts[params.get('kind')] ?? [null, 'Сервер не ответил как ожидалось.'];
      if (title) document.getElementById('title').textContent = title;
      document.getElementById('text').textContent = text;
      document.getElementById('code').textContent = params.get('code') ?? '';
      document.getElementById('retry').addEventListener('click', () => {
        location.href = params.get('url');
      });
    </script>
  </body>
</html>
